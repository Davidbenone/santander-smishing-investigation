<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Santander smishing investigation — isolated lab topology</title>
<desc id="desc">Windows 11 host runs VirtualBox, an OPNsense VM with NAT WAN, isolated LAN and host-only management interface, and a Windows 10 Flare VM connected only to the OPNsense LAN. Traffic passes through OPNsense to the internet.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2f81f7"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3}.title{font-size:30px;font-weight:bold}.subtitle{font-size:16px;fill:#a8b3c4}.heading{font-size:22px;font-weight:bold}.body{font-size:17px}.small{font-size:15px;fill:#b8c5d6}.node{fill:#18243a;stroke:#57749d;stroke-width:2}.line{stroke:#2f81f7;stroke-width:4;fill:none;marker-end:url(#arrow)}.tag{fill:#2b3c54}</style></defs>
<rect width="1200" height="660" fill="#0d1727"/><text x="55" y="65" class="title">Isolated Phishing Analysis Lab</text><text x="55" y="96" class="subtitle">Santander Portugal smishing investigation · VirtualBox + OPNsense + Windows 10</text>
<rect x="42" y="134" width="850" height="405" rx="22" fill="#101f34" stroke="#395473" stroke-width="2" stroke-dasharray="8 6"/><text x="68" y="167" class="heading">Windows 11 physical host · VirtualBox</text>
<rect x="75" y="214" width="300" height="130" rx="15" class="node"/><text x="97" y="247" class="heading">Windows 10 · Flare_VM</text><text x="97" y="278" class="body">Analysis workstation</text><text x="97" y="309" class="small">LAN: 172.20.50.114/24</text>
<rect x="490" y="214" width="365" height="246" rx="15" class="node"/><text x="515" y="249" class="heading">OPNsense firewall VM</text><text x="515" y="288" class="body">LAN (em1): 172.20.50.1/24</text><text x="515" y="325" class="body">WAN (em0): VirtualBox NAT</text><text x="515" y="362" class="body">OPT1 (em2): 192.168.56.2/24</text><text x="515" y="410" class="small">LAN capture: em1 · Firewall filtering</text>
<path class="line" d="M375 274 H488"/><text x="395" y="256" class="small">LAN</text>
<rect x="75" y="399" width="300" height="103" rx="15" class="node"/><text x="97" y="435" class="heading">Host-only management</text><text x="97" y="469" class="small">Host → OPNsense OPT1</text>
<path class="line" d="M375 449 H455 V389 H488"/><text x="391" y="424" class="small">OPT1</text>
<rect x="965" y="240" width="195" height="152" rx="18" class="node"/><text x="996" y="278" class="heading">Internet</text><text x="996" y="310" class="body">DNS + HTTPS</text><text x="996" y="342" class="small">Suspect domain</text><text x="996" y="363" class="small">investigated</text>
<path class="line" d="M855 291 H963"/><text x="881" y="270" class="small">NAT</text>
<rect x="42" y="565" width="1118" height="62" rx="12" class="tag"/><text x="65" y="590" class="body">Evidence: DNS queries · TCP/TLS sessions · HTTP redirect · Firefox warning · 403 response</text><text x="65" y="614" class="small">Note: The diagram shows risk-reduction controls, not a guarantee of complete containment.</text>
</svg>